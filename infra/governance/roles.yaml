# IAM roles and policies (MDAA @aws-mdaa/roles). Personas follow MDAA defaults.
generatePolicies:
  GlueJobPolicy:
    suppressions:
      - id: AwsSolutions-IAM5
        reason: "Glue job log group names are generated per run; SSM path is scoped to this deployment's {{org}} prefix."
    policyDocument:
      Statement:
        - Sid: GlueLogs
          Effect: Allow
          Resource: ["arn:{{partition}}:logs:{{region}}:{{account}}:log-group:/aws-glue/*"]
          Action: [logs:CreateLogStream, logs:AssociateKmsKey, logs:CreateLogGroup, logs:PutLogEvents]
        - Sid: ReadMdaaParameters
          Effect: Allow
          Resource: ["arn:{{partition}}:ssm:{{region}}:{{account}}:parameter/{{org}}/*"]
          Action: [ssm:GetParameter, ssm:GetParameters]
  OrchestrationPolicy:
    suppressions:
      - id: AwsSolutions-IAM5
        reason: "Scoped to this deployment's {{org}}-* Glue jobs and Lambda functions (names generated by MDAA); Step Functions log delivery APIs do not support resource-level permissions."
    policyDocument:
      Statement:
        - Sid: RunGlueJobs
          Effect: Allow
          Resource: ["arn:{{partition}}:glue:{{region}}:{{account}}:job/{{org}}-*"]
          Action: [glue:StartJobRun, glue:GetJobRun, glue:GetJobRuns, glue:BatchStopJobRun]
        - Sid: InvokeAdvisor
          Effect: Allow
          Resource: ["arn:{{partition}}:lambda:{{region}}:{{account}}:function:{{org}}-*"]
          Action: [lambda:InvokeFunction]
        - Sid: StepFunctionsLogging
          Effect: Allow
          Resource: "*"
          Action: [logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery, logs:DeleteLogDelivery,
                   logs:ListLogDeliveries, logs:PutResourcePolicy, logs:DescribeResourcePolicies, logs:DescribeLogGroups]
  DqAdvisorPolicy:
    suppressions:
      - id: AwsSolutions-IAM5
        reason: "Bedrock model is configurable per environment; Athena workgroup, mcds_ops tables and Lambda log groups are generated names."
    policyDocument:
      Statement:
        - Sid: InvokeBedrock
          Effect: Allow
          # In-Region model (e.g. amazon.nova-micro-v1:0) or an inference profile in this region
          Resource: ["arn:{{partition}}:bedrock:{{region}}::foundation-model/*", "arn:{{partition}}:bedrock:{{region}}:{{account}}:inference-profile/*"]
          Action: [bedrock:InvokeModel, bedrock:Converse]
        - Sid: QueryOpsTables
          Effect: Allow
          Resource: ["arn:{{partition}}:athena:{{region}}:{{account}}:workgroup/*"]
          Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults, athena:GetWorkGroup]
        - Sid: ReadCatalog
          Effect: Allow
          Resource:
            - arn:{{partition}}:glue:{{region}}:{{account}}:catalog
            - arn:{{partition}}:glue:{{region}}:{{account}}:database/mcds_ops
            - arn:{{partition}}:glue:{{region}}:{{account}}:table/mcds_ops/*
          Action: [glue:GetDatabase, glue:GetTable, glue:GetTables, glue:GetPartitions]
        - Sid: Logs
          Effect: Allow
          Resource: ["arn:{{partition}}:logs:{{region}}:{{account}}:log-group:/aws/lambda/*"]
          Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
  DataUserPolicy:
    suppressions:
      - id: AwsSolutions-IAM5
        reason: "Coarse-grained Glue catalog read; effective data access is governed by Lake Formation grants. Athena ListWorkGroups has no resource-level permissions."
    policyDocument:
      Statement:
        - Sid: GlueCatalogRead
          Effect: Allow
          Resource:
            - arn:{{partition}}:glue:{{region}}:{{account}}:catalog
            - arn:{{partition}}:glue:{{region}}:{{account}}:database/*
            - arn:{{partition}}:glue:{{region}}:{{account}}:table/*
          Action: [glue:GetDatabase, glue:GetDatabases, glue:GetTable, glue:GetTables, glue:GetPartition,
                   glue:GetPartitions, glue:SearchTables, glue:GetDataQualityResult, glue:ListDataQualityResults]
        - Sid: AthenaList
          Effect: Allow
          Resource: "*"
          Action: [athena:ListWorkGroups]
generateRoles:
  data-admin:                 # platform + Lake Formation administrator
    trustedPrincipal: this_account
    basePersona: data-admin
    generatedPolicies: [DataUserPolicy]
  data-engineer:              # builds and runs pipelines
    trustedPrincipal: this_account
    basePersona: data-engineer
    generatedPolicies: [DataUserPolicy]
  data-analyst:               # Athena on Gold only (Lake Formation grants in infra/dataops/project.yaml)
    trustedPrincipal: this_account
    basePersona: data-scientist
    generatedPolicies: [DataUserPolicy]
  glue-etl:                   # Glue job execution role
    trustedPrincipal: service:glue.amazonaws.com
    awsManagedPolicies: [service-role/AWSGlueServiceRole]
    generatedPolicies: [GlueJobPolicy]
    suppressions:
      - id: AwsSolutions-IAM4
        reason: AWSGlueServiceRole is the AWS-recommended baseline for Glue job execution roles
  orchestration:              # Step Functions execution role
    trustedPrincipal: service:states.amazonaws.com
    generatedPolicies: [OrchestrationPolicy]
    suppressions:
      - id: AwsSolutions-IAM5
        reason: Step Functions log delivery APIs do not support resource-level permissions
  dq-advisor:                 # Bedrock DQ advisor Lambda execution role
    trustedPrincipal: service:lambda.amazonaws.com
    generatedPolicies: [DqAdvisorPolicy]
    suppressions:
      - id: AwsSolutions-IAM5
        reason: Bedrock model and Athena workgroup ARNs are wildcarded so the model can be changed in config
