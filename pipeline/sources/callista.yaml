# ---------------------------------------------------------------------------------------------
# Source tables (Bronze). Generated from Callista schema metadata by scripts/generate_source_config.py.
#   file                  file name inside landing/callista/extract_date=<date>/
#   primary_key           natural key (uniqueness checked by DQ)
#   date_format           Spark pattern for DATE columns in this extract (two formats exist in UC's files)
#   past_century_columns  2-digit-year DATE columns that are always in the past (e.g. BIRTH_DT '15-Mar-75')
#   columns               Callista column -> Spark type + nullability (from SIS_OWNER metadata)
# Columns present in the metadata but absent from an extract are added as NULL (reported, not failed).
# ---------------------------------------------------------------------------------------------
