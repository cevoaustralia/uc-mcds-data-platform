# Reconciliation view: every unit enrolment by cohort and load decision (in-scope, separate, excluded).
report: student_load_by_cohort
use_case: A
description: "Unit enrolments, headcount and EFTSL by cohort and load exclusion reason (reconciliation)"
from: "gold.fact_student_load f"
dimensions:
  academic_year: "f.academic_year"
  cohort: "f.cohort"
  counts_as_load: "f.counts_as_load"
  load_exclusion_reason: "COALESCE(f.load_exclusion_reason, 'COUNTS_AS_LOAD')"
measures:
  unit_enrolments: "COUNT(*)"
  headcount: "COUNT(DISTINCT f.student_id)"
  eftsl: "CAST(SUM(f.eftsl) AS DECIMAL(18,3))"
