# USE CASE B: "How many students enrol and commence in each course?" (course codes only: COURSE_VERSION not extracted)
report: course_enrolment_profile
use_case: B
description: "Students enrolled and commencing per course x academic year, by attendance type and fee category"
from: "gold.fact_student_load f"
where: "f.counts_as_load AND f.cohort IN (${rules.load.load_cohorts_in_scope})"
dimensions:
  academic_year: "f.academic_year"
  course_code: "f.course_code"
  attendance_type: "f.attendance_type"
  fee_category: "f.fee_category"
measures:
  enrolled_students: "COUNT(DISTINCT f.student_id)"
  commencing_students: "COUNT(DISTINCT CASE WHEN f.is_commencing THEN f.student_id END)"
  eftsl: "CAST(SUM(f.eftsl) AS DECIMAL(18,3))"
