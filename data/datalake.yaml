# @aws-mdaa/datalake - KMS-encrypted S3 zones (SOW D1)
#   landing : Callista CSV extracts  callista/<YYYY-MM-DD>/<TABLE>.csv
#   bronze  : Callista tables as Parquet (append-only by _extract_date)  callista/<table>/
#   silver  : MCDS-aligned tables  mcds/<entity>/, MCDS JSON  mcds_json/, DQ results  _dq_results/
#   gold    : student-load reports  analytics/<report>/, MCDS reporting  mcds_reporting/
roles:
  DataAdmin:
    - id: generated-role-id:data-admin
  DataEngineer:
    - id: generated-role-id:data-engineer
  GlueEtl:
    - id: generated-role-id:glue-etl

accessPolicies:
  Root:
    rule:
      prefix: /
      ReadWriteSuperRoles: [DataAdmin]
  Pipeline:
    rule:
      prefix: /
      ReadWriteRoles: [DataEngineer, GlueEtl]

lifecycleConfigurations:
  LandingRetention:
    ExpireExtracts:
      Status: Enabled
      Prefix: callista/
      Transitions:
        - Days: 90
          StorageClass: GLACIER_IR
      ExpirationDays: 365

buckets:
  landing:
    accessPolicies: [Root, Pipeline]
    lifecycleConfiguration: LandingRetention
  bronze:
    accessPolicies: [Root, Pipeline]
    lakeFormationLocations:
      callista:
        prefix: callista
  silver:
    accessPolicies: [Root, Pipeline]
    lakeFormationLocations:
      mcds:
        prefix: mcds
  gold:
    accessPolicies: [Root, Pipeline]
    lakeFormationLocations:
      analytics:
        prefix: analytics
