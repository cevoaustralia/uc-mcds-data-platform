# @aws-mdaa/audit-trail - CloudTrail: management events + S3 data events (SOW D1, D4)
trails:
  s3-audit:
    cloudTrailAuditBucketName: ssm:/{{org}}/shared/audit/bucket/name
    cloudTrailAuditKmsKeyArn: ssm:/{{org}}/shared/audit/kms/cmk/arn
    includeManagementEvents: true
    dataEventSelectors:
      datalake-objects:
        resourceType: AWS::S3::Object
        readWriteType: All
