# @aws-mdaa/roles - IAM personas and service roles (SOW D1 IAM, D4 access control)
# Referenced elsewhere as generated-role-id:<name> or ssm:/{{org}}/shared/generated-role/<name>/arn
generateRoles:
  data-admin:            # platform / Lake Formation administrator
    trustedPrincipal: this_account
    basePersona: data-admin
  data-engineer:         # builds and runs pipelines; read/write bronze+silver, read gold
    trustedPrincipal: this_account
    basePersona: data-engineer
  data-analyst:          # Athena queries on Gold only (Lake Formation grants in dataops/project.yaml)
    trustedPrincipal: this_account
    basePersona: data-scientist
  glue-etl:              # execution role for the Glue jobs
    trustedPrincipal: service:glue.amazonaws.com
    awsManagedPolicies:
      - service-role/AWSGlueServiceRole
    suppressions:
      - id: AwsSolutions-IAM4
        reason: AWSGlueServiceRole is the AWS-recommended baseline for Glue job execution roles
