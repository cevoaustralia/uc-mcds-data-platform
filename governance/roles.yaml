# MDAA IAM Roles Configuration
# IAM roles for Glue ETL, Data Engineers, and Analysts

roles:
  # Glue ETL Service Role
  - name: uc-mcds-glue-etl-role
    description: "Service role for Glue ETL jobs to access S3, Glue Catalog, and KMS"
    assume_role_policy:
      service: glue.amazonaws.com
    
    managed_policies:
      - "arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole"
    
    inline_policies:
      - name: S3DataLakeAccess
        policy:
          Version: "2012-10-17"
          Statement:
            # Landing bucket - Read only
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::${organization}-landing"
                - "arn:aws:s3:::${organization}-landing/*"
            
            # Bronze bucket - Read/Write
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::${organization}-bronze"
                - "arn:aws:s3:::${organization}-bronze/*"
            
            # Silver bucket - Read/Write
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::${organization}-silver"
                - "arn:aws:s3:::${organization}-silver/*"
            
            # Gold bucket - Read/Write
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::${organization}-gold"
                - "arn:aws:s3:::${organization}-gold/*"
            
            # Config bucket - Read only
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::${organization}-config"
                - "arn:aws:s3:::${organization}-config/*"
            
            # Scripts bucket - Read only
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::${organization}-scripts"
                - "arn:aws:s3:::${organization}-scripts/*"
            
            # Temp and Logs buckets - Read/Write
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::${organization}-temp"
                - "arn:aws:s3:::${organization}-temp/*"
                - "arn:aws:s3:::${organization}-logs"
                - "arn:aws:s3:::${organization}-logs/*"
      
      - name: KMSDecryptEncrypt
        policy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource:
                - "arn:aws:kms:*:*:alias/uc-mcds-landing"
                - "arn:aws:kms:*:*:alias/uc-mcds-bronze"
                - "arn:aws:kms:*:*:alias/uc-mcds-silver"
                - "arn:aws:kms:*:*:alias/uc-mcds-gold"
      
      - name: GlueCatalogAccess
        policy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetTable
                - glue:GetPartition
                - glue:GetPartitions
                - glue:CreateTable
                - glue:UpdateTable
                - glue:DeleteTable
                - glue:CreatePartition
                - glue:UpdatePartition
                - glue:DeletePartition
                - glue:BatchCreatePartition
                - glue:BatchDeletePartition
              Resource:
                - "arn:aws:glue:*:*:catalog"
                - "arn:aws:glue:*:*:database/mcds_bronze"
                - "arn:aws:glue:*:*:database/mcds_silver"
                - "arn:aws:glue:*:*:database/mcds_gold"
                - "arn:aws:glue:*:*:table/mcds_bronze/*"
                - "arn:aws:glue:*:*:table/mcds_silver/*"
                - "arn:aws:glue:*:*:table/mcds_gold/*"
      
      - name: CloudWatchLogs
        policy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource:
                - "arn:aws:logs:*:*:log-group:/aws-glue/*"
    
    tags:
      project: uc-mcds-data-platform
      environment: "${context.environment}"
      purpose: etl
      managed-by: mdaa
      sow-deliverable: D1
      cost-center: university-analytics

  # Data Engineer Role
  - name: uc-mcds-data-engineer-role
    description: "Role for data engineers to manage Bronze/Silver/Gold layers"
    assume_role_policy:
      principals:
        - type: AWS
          identifiers:
            - "arn:aws:iam::${AWS::AccountId}:root"
    
    managed_policies:
      - "arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess"
      - "arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess"
      - "arn:aws:iam::aws:policy/CloudWatchLogsReadOnlyAccess"
    
    inline_policies:
      - name: DataLakeFullAccess
        policy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:*
              Resource:
                - "arn:aws:s3:::${organization}-landing/*"
                - "arn:aws:s3:::${organization}-bronze/*"
                - "arn:aws:s3:::${organization}-silver/*"
                - "arn:aws:s3:::${organization}-gold"
                - "arn:aws:s3:::${organization}-gold/*"
      
      - name: GlueJobManagement
        policy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - glue:StartJobRun
                - glue:GetJobRun
                - glue:GetJobRuns
                - glue:StopJobRun
              Resource:
                - "arn:aws:glue:*:*:job/*"
    
    tags:
      project: uc-mcds-data-platform
      environment: "${context.environment}"
      purpose: data-engineering
      managed-by: mdaa
      sow-deliverable: D4
      cost-center: university-analytics

  # Analyst Role
  - name: uc-mcds-analyst-role
    description: "Role for analysts to query Gold layer via Athena"
    assume_role_policy:
      principals:
        - type: AWS
          identifiers:
            - "arn:aws:iam::${AWS::AccountId}:root"
    
    managed_policies:
      - "arn:aws:iam::aws:policy/AmazonAthenaFullAccess"
      - "arn:aws:iam::aws:policy/CloudWatchLogsReadOnlyAccess"
    
    inline_policies:
      - name: GoldLayerReadOnly
        policy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::${organization}-gold"
                - "arn:aws:s3:::${organization}-gold/*"
                - "arn:aws:s3:::${organization}-athena-results"
                - "arn:aws:s3:::${organization}-athena-results/*"
            
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - "arn:aws:s3:::${organization}-athena-results/*"
      
      - name: GlueCatalogGoldReadOnly
        policy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetTable
                - glue:GetPartition
                - glue:GetPartitions
              Resource:
                - "arn:aws:glue:*:*:catalog"
                - "arn:aws:glue:*:*:database/mcds_gold"
                - "arn:aws:glue:*:*:table/mcds_gold/*"
      
      - name: KMSDecryptGold
        policy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:DescribeKey
              Resource:
                - "arn:aws:kms:*:*:alias/uc-mcds-gold"
    
    tags:
      project: uc-mcds-data-platform
      environment: "${context.environment}"
      purpose: analytics
      managed-by: mdaa
      sow-deliverable: D4
      cost-center: university-analytics
