# @aws-mdaa/dataops-project - Glue databases + Lake Formation grants (SOW D1, D4)
# Access model (SOW D4):
#   data-admin    : super on all databases
#   data-engineer : read on all databases (writes happen through the Glue jobs)
#   glue-etl      : super (jobs replace tables each run)
#   data-analyst  : read on mcds_gold only; no access to bronze/silver
dataAdminRoles:
  - id: generated-role-id:data-admin
dataEngineerRoles:
  - id: generated-role-id:data-engineer
projectExecutionRoles:
  - id: generated-role-id:glue-etl
s3OutputKmsKeyArn: ssm:/{{org}}/datalake/datalake/kms/arn

databases:
  mcds_bronze:
    description: "Bronze - Callista SIS_OWNER tables as extracted (CSV -> Parquet), append-only by extract date"
    verbatimName: true
    locationBucketName: ssm:/{{org}}/datalake/datalake/bucket/bronze/name
    locationPrefix: callista
    lakeFormation:
      createSuperGrantsForDataAdminRoles: true
      createReadGrantsForDataEngineerRoles: true
      createReadWriteGrantsForProjectExecutionRoles: super
  mcds_silver:
    description: "Silver - MCDS v2.1.1-aligned student enrolment entities (student, unit_of_learning, organisation, location, learning_period, student_unit_load)"
    verbatimName: true
    locationBucketName: ssm:/{{org}}/datalake/datalake/bucket/silver/name
    locationPrefix: mcds
    lakeFormation:
      createSuperGrantsForDataAdminRoles: true
      createReadGrantsForDataEngineerRoles: true
      createReadWriteGrantsForProjectExecutionRoles: super
  mcds_gold:
    description: "Gold - curated student load reports by unit, campus, teaching org unit and unit x campus (SOW D5)"
    verbatimName: true
    locationBucketName: ssm:/{{org}}/datalake/datalake/bucket/gold/name
    locationPrefix: analytics
    lakeFormation:
      createSuperGrantsForDataAdminRoles: true
      createReadGrantsForDataEngineerRoles: true
      createReadWriteGrantsForProjectExecutionRoles: super
      grants:
        analyst-read:
          databasePermissions: read
          tablePermissions: read
          principals:
            data-analyst:
              role:
                id: generated-role-id:data-analyst
