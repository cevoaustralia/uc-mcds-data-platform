# Silver Layer Mappings
# Maps Bronze tables to MCDS v2.1.1 entities

version: "1.0"

transformations:
  - source: bronze.callista.st_student
    target: silver.student_management
    schema: schemas/student-management.json
    transformations:
      - type: flatten
      - type: validate_mcds
      - type: enrich_reference_data
    
  - source: bronze.callista.st_programme
    target: silver.curriculum_programmes
    schema: schemas/curriculum-programmes.json
    transformations:
      - type: flatten
      - type: validate_mcds
      - type: map_aqf_levels
    
  - source: bronze.callista.st_unit_of_learning
    target: silver.curriculum_units
    schema: schemas/curriculum-units.json
    transformations:
      - type: flatten
      - type: validate_mcds
      - type: map_discipline_codes
    
  - source: bronze.callista.st_unit_enrolment
    target: silver.unit_enrolments
    schema: schemas/unit-enrolments.json
    transformations:
      - type: flatten
      - type: validate_mcds
      - type: join_student_unit
    
  - source: bronze.callista.st_address
    target: silver.facilities
    schema: schemas/facilities.json
    transformations:
      - type: flatten
      - type: validate_mcds
      - type: deduplicate_facilities
    
  - source: reference_data/
    target: silver.reference_data
    schema: schemas/reference-data.json
    transformations:
      - type: load_sacc
      - type: load_aqf
      - type: load_tcsi
