# MDAA Glue ETL Jobs Configuration
# Glue job definitions for Bronze→Silver→Gold pipeline

jobs:
  # Landing to Bronze - CSV ingestion
  - name: landing-to-bronze
    description: "Ingest Callista CSV files from Landing to Bronze (Parquet)"
    role: "${GlueETLRole.Arn}"
    glue_version: "3.0"
    python_version: "3"
    worker_type: G.1X
    number_of_workers: 2
    max_concurrent_runs: 5
    timeout: 10  # minutes
    max_retries: 2
    
    script_location: "s3://${organization}-scripts/etl/bronze/landing-to-bronze.py"
    
    default_arguments:
      "--job-language": "python"
      "--enable-metrics": "true"
      "--enable-spark-ui": "true"
      "--spark-event-logs-path": "s3://${organization}-logs/spark-logs/"
      "--enable-job-insights": "true"
      "--enable-glue-datacatalog": "true"
      "--TempDir": "s3://${organization}-temp/glue-temp/"
      "--INPUT_BUCKET": "${organization}-landing"
      "--OUTPUT_BUCKET": "${organization}-bronze"
      "--DATABASE_NAME": "mcds_bronze"
    
    tags:
      project: uc-mcds-data-platform
      environment: "${context.environment}"
      pipeline: bronze
      layer: bronze
      managed-by: mdaa
      sow-deliverable: D3
      cost-center: university-analytics

  # Bronze to Silver - MCDS transformation
  - name: bronze-to-silver
    description: "Transform Bronze Callista data to Silver MCDS v2.1.1 format"
    role: "${GlueETLRole.Arn}"
    glue_version: "3.0"
    python_version: "3"
    worker_type: G.1X
    number_of_workers: 3
    max_concurrent_runs: 1
    timeout: 20  # minutes
    max_retries: 2
    
    script_location: "s3://${organization}-scripts/etl/silver/bronze-to-silver.py"
    
    default_arguments:
      "--job-language": "python"
      "--enable-metrics": "true"
      "--enable-spark-ui": "true"
      "--spark-event-logs-path": "s3://${organization}-logs/spark-logs/"
      "--enable-job-insights": "true"
      "--enable-glue-datacatalog": "true"
      "--TempDir": "s3://${organization}-temp/glue-temp/"
      "--INPUT_DATABASE": "mcds_bronze"
      "--OUTPUT_BUCKET": "${organization}-silver"
      "--OUTPUT_DATABASE": "mcds_silver"
      "--CONFIG_BUCKET": "${organization}-config"
      "--BUSINESS_RULES_PATH": "config/business-rules.yaml"
      "--SILVER_MAPPINGS_PATH": "config/silver-mappings.yaml"
    
    tags:
      project: uc-mcds-data-platform
      environment: "${context.environment}"
      pipeline: silver
      layer: silver
      managed-by: mdaa
      sow-deliverable: D2
      sow-deliverable-d3: transformation
      cost-center: university-analytics

  # Silver to Gold - Analytics aggregations
  - name: silver-to-gold
    description: "Generate Gold analytics reports from Silver MCDS data"
    role: "${GlueETLRole.Arn}"
    glue_version: "3.0"
    python_version: "3"
    worker_type: G.1X
    number_of_workers: 2
    max_concurrent_runs: 1
    timeout: 10  # minutes
    max_retries: 2
    
    script_location: "s3://${organization}-scripts/etl/gold/silver-to-gold.py"
    
    default_arguments:
      "--job-language": "python"
      "--enable-metrics": "true"
      "--enable-spark-ui": "true"
      "--spark-event-logs-path": "s3://${organization}-logs/spark-logs/"
      "--enable-job-insights": "true"
      "--enable-glue-datacatalog": "true"
      "--TempDir": "s3://${organization}-temp/glue-temp/"
      "--INPUT_DATABASE": "mcds_silver"
      "--OUTPUT_BUCKET": "${organization}-gold"
      "--OUTPUT_DATABASE": "mcds_gold"
      "--CONFIG_BUCKET": "${organization}-config"
      "--GOLD_AGGREGATIONS_PATH": "config/gold-aggregations.yaml"
      "--BUSINESS_RULES_PATH": "config/business-rules.yaml"
    
    tags:
      project: uc-mcds-data-platform
      environment: "${context.environment}"
      pipeline: gold
      layer: gold
      managed-by: mdaa
      sow-deliverable: D5
      cost-center: university-analytics

  # Data Quality Validation - Cross-layer checks
  - name: data-quality-checks
    description: "Run data quality validation across all layers"
    role: "${GlueETLRole.Arn}"
    glue_version: "3.0"
    python_version: "3"
    worker_type: G.1X
    number_of_workers: 2
    max_concurrent_runs: 1
    timeout: 15  # minutes
    max_retries: 1
    
    script_location: "s3://${organization}-scripts/etl/validation/data-quality-checks.py"
    
    default_arguments:
      "--job-language": "python"
      "--enable-metrics": "true"
      "--enable-spark-ui": "true"
      "--spark-event-logs-path": "s3://${organization}-logs/spark-logs/"
      "--enable-job-insights": "true"
      "--enable-glue-datacatalog": "true"
      "--TempDir": "s3://${organization}-temp/glue-temp/"
      "--LANDING_BUCKET": "${organization}-landing"
      "--BRONZE_DATABASE": "mcds_bronze"
      "--SILVER_DATABASE": "mcds_silver"
      "--GOLD_DATABASE": "mcds_gold"
      "--CONFIG_BUCKET": "${organization}-config"
      "--DQ_RULES_PATH": "config/business-rules.yaml"
    
    tags:
      project: uc-mcds-data-platform
      environment: "${context.environment}"
      pipeline: validation
      layer: all
      managed-by: mdaa
      sow-deliverable: D4
      cost-center: university-analytics
