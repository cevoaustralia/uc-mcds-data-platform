# @aws-mdaa/dataops-job - Glue ETL jobs (SOW D3 onboarding pattern, D5 reporting)
# Order: landing-to-bronze -> bronze-to-silver -> silver-to-gold
# MDAA uploads scriptLocation + additionalScripts (--extra-py-files) + additionalFiles
# (--extra-files: the config YAMLs, placed in the job working directory).
# Changing config/*.yaml and redeploying changes behaviour with no code change.
projectName: project

templates:
  mcds-glue:
    executionRoleArn: &glue_role ssm:/{{org}}/shared/generated-role/glue-etl/arn
    description: UC MCDS Glue ETL job
    defaultArguments: &common_args
      --enable-glue-datacatalog: "true"
      --enable-metrics: "true"
      --enable-job-insights: "true"
      --additional-python-modules: "pyyaml==6.0.2"
    command:
      name: glueetl
      pythonVersion: "3"
      scriptLocation: ../etl/silver/bronze-to-silver.py
    glueVersion: "4.0"
    workerType: G.1X
    maxRetries: 1
    executionProperty:
      maxConcurrentRuns: 1
    continuousLogging:
      logGroupRetentionDays: 90
    additionalScripts: &common_scripts
      - ../etl/common/schemas.py
      - ../etl/common/pipeline.py
      - ../etl/common/data_quality.py
      - ../etl/common/glue_io.py
    additionalFiles: &config_files
      - ../config/business-rules.yaml
      - ../config/silver-mappings.yaml
      - ../config/gold-aggregations.yaml
      - ../config/data-quality-rules.yaml

jobs:
  landing-to-bronze:
    template: mcds-glue
    executionRoleArn: *glue_role
    description: "Callista CSV extract (landing) -> Bronze Parquet + catalog + Bronze DQ"
    command:
      name: glueetl
      pythonVersion: "3"
      scriptLocation: ../etl/bronze/landing-to-bronze.py
    numberOfWorkers: 2
    timeout: 15
    additionalScripts: *common_scripts
    additionalFiles: *config_files
    defaultArguments:
      <<: *common_args
      --LANDING_BUCKET: ssm:/{{org}}/datalake/datalake/bucket/landing/name
      --BRONZE_BUCKET: ssm:/{{org}}/datalake/datalake/bucket/bronze/name
      --BRONZE_DATABASE: mcds_bronze

  bronze-to-silver:
    template: mcds-glue
    executionRoleArn: *glue_role
    description: "Bronze Callista -> Silver MCDS tables + lineage comments + DQ + MCDS JSON export"
    command:
      name: glueetl
      pythonVersion: "3"
      scriptLocation: ../etl/silver/bronze-to-silver.py
    numberOfWorkers: 3
    timeout: 20
    additionalScripts: *common_scripts
    additionalFiles: *config_files
    defaultArguments:
      <<: *common_args
      --BRONZE_DATABASE: mcds_bronze
      --SILVER_BUCKET: ssm:/{{org}}/datalake/datalake/bucket/silver/name
      --SILVER_DATABASE: mcds_silver

  silver-to-gold:
    template: mcds-glue
    executionRoleArn: *glue_role
    description: "Silver MCDS -> Gold student load reports + reconciliation DQ + MCDS Reporting Framework export"
    command:
      name: glueetl
      pythonVersion: "3"
      scriptLocation: ../etl/gold/silver-to-gold.py
    numberOfWorkers: 2
    timeout: 15
    additionalScripts: *common_scripts
    additionalFiles: *config_files
    defaultArguments:
      <<: *common_args
      --SILVER_DATABASE: mcds_silver
      --GOLD_BUCKET: ssm:/{{org}}/datalake/datalake/bucket/gold/name
      --GOLD_DATABASE: mcds_gold
