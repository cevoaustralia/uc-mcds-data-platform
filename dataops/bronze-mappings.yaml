# Bronze Layer Mappings
# Maps Callista source tables to Bronze S3 locations

version: "1.0"

sources:
  callista:
    connection: dms-callista-oracle
    tables:
      - name: ST_STUDENT
        target: s3://bronze/callista/st_student/
        partition_keys: [year, month, day]
        format: parquet
        
      - name: ST_ADDRESS
        target: s3://bronze/callista/st_address/
        partition_keys: [year, month, day]
        format: parquet
        
      - name: ST_ENROLMENT
        target: s3://bronze/callista/st_enrolment/
        partition_keys: [year, month, day]
        format: parquet
        
      - name: ST_UNIT_ENROLMENT
        target: s3://bronze/callista/st_unit_enrolment/
        partition_keys: [year, month, day]
        format: parquet
        
      - name: ST_PROGRAMME
        target: s3://bronze/callista/st_programme/
        partition_keys: [year, month, day]
        format: parquet
        
      - name: ST_UNIT_OF_LEARNING
        target: s3://bronze/callista/st_unit_of_learning/
        partition_keys: [year, month, day]
        format: parquet
