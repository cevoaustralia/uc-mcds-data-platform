# Callista (Bronze) -> MCDS v2.1.1 (Silver) mapping specification
#
# This file is executed by etl/common/pipeline.py:
#   - `columns` are Spark SQL expressions evaluated against the source table
#   - `mcds` is the MCDS JSON path the column populates (used for the MCDS JSON export,
#     Glue column comments and column-level lineage, SOW D4)
#   - `{identity.*}` tokens are resolved from config/business-rules.yaml
#
# MCDS conformance is checked by exporting Silver to MCDS JSON and validating it against
# studentlifecycle.schema.json (scripts/validate-mcds-json.py). Validating against
# parties.schema.json alone checks nothing: that file has no root constraints.

version: 2
mcds_version: "2.1.1"
mcds_root_schema: studentlifecycle.schema.json

entities:

  # ---------------------------------------------------------------- student
  student:
    description: "MCDS student (parties.schema.json#/$defs/student). Only people with government load."
    source: PERSON
    restrict_to: people_with_load        # PERSON also holds staff/applicants
    primary_key: [student_id]
    pii: true
    columns:
      student_id:
        expr: "{identity.student_id_format}"
        mcds: "students[].studentID"                    # required
      person_id:
        expr: "{identity.person_id_format}"
        mcds: "students[].personID"
      student_number:
        expr: "{identity.student_number.format}"
        mcds: "students[].studentNumber"                # required
      last_name:
        expr: "SURNAME"
        mcds: "students[].studentName.lastName"         # required (masked in EBA)
        pii: true
      first_name:
        expr: "GIVEN_NAMES"
        mcds: "students[].studentName.firstName"
        pii: true

  # ---------------------------------------------------------------- unit of learning
  unit_of_learning:
    description: "MCDS unitOfLearning (curriculum.schema.json#/$defs/unitOfLearning). One row per unit version."
    source: UNIT_VERSION
    primary_key: [unit_of_learning_id]
    columns:
      unit_of_learning_id:
        expr: "concat(UNIT_CD, '/', CAST(VERSION_NUMBER AS STRING))"
        mcds: "unitsOfLearning[].unitOfLearningID"
      unit_code:
        expr: "UNIT_CD"
        mcds: "unitsOfLearning[].unitOfLearningCode"    # required
      unit_version:
        expr: "VERSION_NUMBER"
        mcds: "unitsOfLearning[].version"
      unit_name:
        expr: "TITLE"
        mcds: "unitsOfLearning[].unitOfLearningName"    # required
      short_name:
        expr: "SHORT_TITLE"
        mcds: "unitsOfLearning[].shortName"
      unit_level:
        expr: "UNIT_LEVEL"
        mcds: "unitsOfLearning[].level"                 # number in MCDS; cast when numeric
      credit_points:
        expr: "ENROLLED_CREDIT_POINTS"
        mcds: "unitsOfLearning[].x-additional.enrolledCreditPoints"
      owner_organisation_id:
        expr: "concat(OWNER_ORG_UNIT_CD, '|', date_format(OWNER_OU_START_DT, 'yyyy-MM-dd'))"
        mcds: "unitsOfLearning[].responsibleOrganisations[role=Unit owner].organisationID"
      unit_status:
        expr: "UNIT_STATUS"
        mcds: "unitsOfLearning[].status"

  # ---------------------------------------------------------------- organisation (faculty/school)
  organisation:
    description: "MCDS organisation (parties.schema.json#/$defs/organisation) from ORG_UNIT. Teaching-responsibility facility view."
    source: ORG_UNIT
    primary_key: [organisation_id]
    columns:
      organisation_id:
        expr: "concat(ORG_UNIT_CD, '|', date_format(START_DT, 'yyyy-MM-dd'))"
        mcds: "organisations[].organisationID"
      organisation_code:
        expr: "ORG_UNIT_CD"
        mcds: "organisations[].organisationCode"
      organisation_name:
        expr: "DESCRIPTION"
        mcds: "organisations[].organisationName"        # required
      organisation_type:
        expr: "ORG_TYPE"
        mcds: "organisations[].x-additional.callistaOrgType"
      start_date:
        expr: "START_DT"
        mcds: "organisations[].x-additional.effectiveFromDate"
      end_date:
        expr: "END_DT"
        mcds: "organisations[].x-additional.effectiveToDate"
      status:
        expr: "ORG_STATUS"
        mcds: "organisations[].status"

  # ---------------------------------------------------------------- location (campus)
  location:
    description: "MCDS location (locations.schema.json#/$defs/location) from LOCATION. Campus facility view."
    source: LOCATION
    primary_key: [location_id]
    columns:
      location_id:
        expr: "LOCATION_CD"
        mcds: "locations[].locationID"
      location_code:
        expr: "LOCATION_CD"
        mcds: "locations[].code"
      location_name:
        expr: "DESCRIPTION"
        mcds: "locations[].locationName"                # required
      callista_location_type:
        expr: "LOCATION_TYPE"
        mcds: "locations[].locationType (via business-rules location_type_map)"
      govt_location_cd:
        expr: "GOVT_LOCATION_CD"
        mcds: "locations[].x-additional.govtLocationCode"
      is_closed:
        expr: "CLOSED_IND = 'Y'"
        mcds: "(not exported)"

  # ---------------------------------------------------------------- learning period
  learning_period:
    description: "MCDS learningPeriod (time.schema.json#/$defs/learningPeriod) from CAL_INSTANCE. Required by unitOfLearningAvailability."
    source: CAL_INSTANCE
    primary_key: [learning_period_id]
    columns:
      learning_period_id:
        expr: "concat(CAL_TYPE, '|', CAST(SEQUENCE_NUMBER AS STRING))"
        mcds: "learningPeriods[].learningPeriodID"
      cal_type:
        expr: "CAL_TYPE"
        mcds: "learningPeriods[].x-additional.callistaCalType"
      code:
        expr: "coalesce(ALTERNATE_CODE, concat(CAL_TYPE, '-', CAST(SEQUENCE_NUMBER AS STRING)))"
        mcds: "learningPeriods[].code"
      start_date:
        expr: "START_DT"
        mcds: "learningPeriods[].startDate"
      end_date:
        expr: "END_DT"
        mcds: "learningPeriods[].endDate"
      year:
        expr: "CAST(year(START_DT) AS STRING)"
        mcds: "learningPeriods[].year"

  # ---------------------------------------------------------------- fact: student unit load
  student_unit_load:
    description: >-
      Government student load at census. One row per selected GOVT_STUDENT_LOAD row
      (student x course x unit attempt x teaching org unit split). Feeds MCDS
      unitOfLearningEnrolment / unitOfLearningAvailability and all Gold reports.
    source: GOVT_STUDENT_LOAD
    primary_key: [load_id]
    # Step 1 (pipeline.select_government_load): keep the latest SUBMISSION_NUMBER per unit
    #         attempt (business-rules government_load.submission_selection).
    # Step 2 (pipeline.build_silver): LEFT JOIN STUDENT_UNIT_ATTEMPT (columns prefixed att_).
    #         Row count must not change (DQ rule fact_no_fanout).
    # The other dimensions are referenced by their full composite key and verified by the
    # fk_* DQ rules; Gold and the MCDS export join them on these keys.
    joins:
      - table: STUDENT_UNIT_ATTEMPT
        on: "PERSON_ID, COURSE_CD, UNIT_CD, UV_VERSION_NUMBER=VERSION_NUMBER, SUA_CAL_TYPE=CAL_TYPE, SUA_CI_SEQUENCE_NUMBER=CI_SEQUENCE_NUMBER"
        provides: "LOCATION_CD (campus, MCDS location), UOO_ID (unit offering, MCDS unitOfLearningAvailabilityID)"
    references:
      - table: UNIT_VERSION
        key: "UNIT_CD, UV_VERSION_NUMBER=VERSION_NUMBER"
      - table: ORG_UNIT
        key: "TR_ORG_UNIT_CD=ORG_UNIT_CD, TR_OU_START_DT=START_DT"
      - table: CAL_INSTANCE
        key: "SUA_CAL_TYPE=CAL_TYPE, SUA_CI_SEQUENCE_NUMBER=SEQUENCE_NUMBER"
      - table: PERSON
        key: "PERSON_ID"
    columns:
      load_id:
        expr: "md5(concat_ws('|', SUBMISSION_YR, SUBMISSION_NUMBER, PERSON_ID, COURSE_CD, CRV_VERSION_NUMBER, GOVT_SEMESTER, UNIT_CD, UV_VERSION_NUMBER, SUA_CAL_TYPE, SUA_CI_SEQUENCE_NUMBER, TR_ORG_UNIT_CD, TR_OU_START_DT))"
        mcds: "(row key)"
      unit_enrolment_id:
        expr: "md5(concat_ws('|', PERSON_ID, COURSE_CD, UNIT_CD, UV_VERSION_NUMBER, SUA_CAL_TYPE, SUA_CI_SEQUENCE_NUMBER))"
        mcds: "students[].unitOfLearningEnrolments[].unitOfLearningEnrolmentID"
      programme_enrolment_id:
        expr: "concat(CAST(PERSON_ID AS STRING), '|', COURSE_CD)"
        mcds: "students[].unitOfLearningEnrolments[].programmeOfLearningEnrolmentID"   # required
      student_id:
        expr: "{identity.student_id_format}"
        mcds: "students[].unitOfLearningEnrolments[].studentID"                        # required
      course_code:
        expr: "COURSE_CD"
        mcds: "programmeOfLearningEnrolments[].programmeOfLearning.programmeOfLearningCode"
      unit_of_learning_id:
        expr: "concat(UNIT_CD, '/', CAST(UV_VERSION_NUMBER AS STRING))"
        mcds: "...unitOfLearningAvailability.unitOfLearning.unitOfLearningID"
      unit_code:
        expr: "UNIT_CD"
        mcds: "...unitOfLearningAvailability.unitOfLearning.unitOfLearningCode"
      unit_version:
        expr: "UV_VERSION_NUMBER"
        mcds: "...unitOfLearningAvailability.unitOfLearning.version"
      unit_offering_id:
        expr: "CAST(att_UOO_ID AS STRING)"
        mcds: "...unitOfLearningAvailability.unitOfLearningAvailabilityID"
      learning_period_id:
        expr: "concat(SUA_CAL_TYPE, '|', CAST(SUA_CI_SEQUENCE_NUMBER AS STRING))"
        mcds: "...unitOfLearningAvailability.learningPeriod"                           # required
      location_id:
        expr: "att_LOCATION_CD"
        mcds: "...unitOfLearningAvailability.location"                                 # required
      teaching_organisation_id:
        expr: "concat(TR_ORG_UNIT_CD, '|', date_format(TR_OU_START_DT, 'yyyy-MM-dd'))"
        mcds: "...unitOfLearningAvailability.responsibleOrganisations[role=Teaching responsibility]"
      teaching_org_unit_code:
        expr: "TR_ORG_UNIT_CD"
        mcds: "(reporting dimension)"
      reporting_year:
        expr: "SUBMISSION_YR"
        mcds: "unitOfLearningEnrolments[].x-additional.governmentLoad.submissionYear"
      govt_semester:
        expr: "GOVT_SEMESTER"
        mcds: "unitOfLearningEnrolments[].x-additional.governmentLoad.governmentSemester"
      reporting_period:
        expr: "{reporting_period.format}"
        mcds: "reporting factData.reportingPeriod.code"
      submission_number:
        expr: "SUBMISSION_NUMBER"
        mcds: "unitOfLearningEnrolments[].x-additional.governmentLoad.submissionNumber"
      eftsu:
        expr: "CAST(EFTSU AS DECIMAL(12,6))"
        mcds: "unitOfLearningEnrolments[].x-additional.governmentLoad.eftsl (summed over teaching splits)"
      completion_status:
        expr: "UNIT_COMPLETION_STATUS"
        mcds: "unitOfLearningEnrolments[].status (via business-rules completion_status)"
      discipline_group_code:
        expr: "DISCIPLINE_GROUP_CD"
        mcds: "unitOfLearningEnrolments[].x-additional.governmentLoad.disciplineGroupCode"
