# Data Quality Thresholds
dq_thresholds:
  row_count_tolerance: 0.0  # Bronze must match Landing exactly
  silver_retention_min: 0.95  # Silver can lose up to 5% due to filtering
  gold_aggregation_tolerance: 0.01  # Gold sums must match Silver within 1%
  required_fields:
    - studentId
    - unitCode
    - facility
  null_tolerance: 0.0  # 0% nulls allowed in required fields
