# UC MCDS Data Platform - Business Rules
# Read at runtime by etl/common/pipeline.py (Glue jobs load it from the config S3 location;
# scripts/run-local-pipeline.py loads it from disk). Changing a value here changes behaviour
# without code changes.
#
# Items with `confirmed: false` are EBA defaults awaiting UC confirmation. Each one is listed
# in Docs/published-docs/05-UC-Requirements-and-Open-Decisions.md.

version: 2

source:
  system: callista
  extract_format: csv                      # Callista arrives as CSV extracts
  # Relative to the landing bucket/folder. {extract_date} = YYYY-MM-DD
  extract_path_pattern: "callista/{extract_date}/{table}.csv"
  csv_options:
    header: true
    delimiter: ","
    date_format: "yyyy-MM-dd"
    null_value: ""

identity:
  # MCDS student.studentID: system record ID. MCDS says it must differ from personID.
  student_id_format: "STU-{PERSON_ID}"
  # MCDS student.personID / person record ID
  person_id_format: "{PERSON_ID}"
  # MCDS student.studentNumber: the student-facing number.
  student_number:
    format: "{PERSON_ID}"
    confirmed: false
    notes: >-
      Callista PERSON_ID is commonly the student-facing ID. If UC uses another identifier,
      it lives in ALTERNATE_PERSON_ID (API_PERSON_ID for a given PERSON_ID_TYPE).

government_load:
  # GOVT_STUDENT_LOAD holds one row per submission. A unit attempt re-reported in a later
  # SUBMISSION_NUMBER would be double counted if all submissions were summed.
  #   latest_per_unit_attempt: keep only the highest SUBMISSION_NUMBER per unit attempt
  #   all: keep every row (only safe if UC confirms submissions never overlap)
  submission_selection: latest_per_unit_attempt
  # TCSI E355 codes counted as load. Default = all rows in the government load file
  # (they are census-date liable load). Do NOT use [1, 2] as "active": 1 = withdrew, 2 = failed.
  include_completion_status: [1, 2, 3, 4, 5]
  confirmed: false

reporting_period:
  # GOVT_SEMESTER is NUMBER(1). Reporting period is derived as YEAR-SEMESTER, e.g. "2026-1".
  format: "{SUBMISSION_YR}-{GOVT_SEMESTER}"
  pattern: "^[0-9]{4}-[12]$"

# TCSI element E355 "Unit of study status code" (tcsisupport.gov.au/element/355)
completion_status:
  1: {label: "Withdrew without academic penalty", mcds_status: "Withdrawn"}
  2: {label: "Failed", mcds_status: "Failed"}
  3: {label: "Successfully completed", mcds_status: "Completed"}
  4: {label: "In progress / not yet determined", mcds_status: "In Progress"}
  5: {label: "Recognition of prior learning (VET only)", mcds_status: "Recognition of Prior Learning"}

facility:
  # SOW D5 "facilities". Both are modelled; this picks the headline facility report.
  #   campus            -> LOCATION via STUDENT_UNIT_ATTEMPT.LOCATION_CD (MCDS location)
  #   teaching_org_unit -> ORG_UNIT via TR_ORG_UNIT_CD + TR_OU_START_DT (MCDS organisation)
  primary: campus
  confirmed: false

# Callista LOCATION.LOCATION_TYPE (UC-defined codes) -> MCDS locationType enum
# (Region | Campus | Building | Site | Space | Virtual)
location_type_map:
  CAMPUS: Campus
  ONLINE: Virtual
  SITE: Site
  _default: Campus

mcds_export:
  institution:
    organisationId: "urn:org:au:university-of-canberra"
    legalName: "University of Canberra"
  students_per_file: 500
  teaching_role: "Teaching responsibility"
  owner_role: "Unit owner"
