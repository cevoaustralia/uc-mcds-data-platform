# Data quality rules (SOW D2: "data quality validation rules configured")
#
# Executed by etl/common/data_quality.py against the Bronze/Silver/Gold tables registered
# as Spark views. Every rule is a SQL query that returns the number of violating rows
# (`violations`). 0 = pass. `severity: fail` stops the pipeline; `warn` is reported only.
# Results are written to the audit trail (s3://<silver>/_dq_results/ and the run report).
#
# View names: bronze_<table> (latest extract), silver_<entity>, gold_<report>,
# plus bronze_gsl_selected (GOVT_STUDENT_LOAD after submission selection).

version: 2

rules:

  # ---------- completeness
  - id: student_required_fields
    layer: silver
    description: "MCDS required student fields present (studentID, studentNumber, studentName.lastName)"
    severity: fail
    sql: "SELECT COUNT(*) FROM silver_student WHERE student_id IS NULL OR student_number IS NULL OR last_name IS NULL OR trim(last_name) = ''"

  - id: unit_required_fields
    layer: silver
    description: "MCDS required unitOfLearning fields present (code, name)"
    severity: fail
    sql: "SELECT COUNT(*) FROM silver_unit_of_learning WHERE unit_code IS NULL OR unit_name IS NULL"

  - id: fact_required_fields
    layer: silver
    description: "MCDS required enrolment/availability fields present (student, programme enrolment, unit, learning period, location)"
    severity: fail
    sql: >-
      SELECT COUNT(*) FROM silver_student_unit_load
      WHERE student_id IS NULL OR programme_enrolment_id IS NULL OR unit_code IS NULL
         OR learning_period_id IS NULL OR location_id IS NULL OR eftsu IS NULL

  # ---------- uniqueness (composite keys from the real Callista schema)
  - id: bronze_gsl_key_unique
    layer: bronze
    description: "GOVT_STUDENT_LOAD natural key unique"
    severity: fail
    sql: >-
      SELECT COUNT(*) FROM (SELECT 1 FROM bronze_govt_student_load
        GROUP BY SUBMISSION_YR, SUBMISSION_NUMBER, PERSON_ID, COURSE_CD, CRV_VERSION_NUMBER, GOVT_SEMESTER,
                 UNIT_CD, UV_VERSION_NUMBER, SUA_CAL_TYPE, SUA_CI_SEQUENCE_NUMBER, TR_ORG_UNIT_CD, TR_OU_START_DT
        HAVING COUNT(*) > 1)

  - id: bronze_sua_key_unique
    layer: bronze
    description: "STUDENT_UNIT_ATTEMPT key unique (so the fact join cannot fan out)"
    severity: fail
    sql: >-
      SELECT COUNT(*) FROM (SELECT 1 FROM bronze_student_unit_attempt
        GROUP BY PERSON_ID, COURSE_CD, UNIT_CD, VERSION_NUMBER, CAL_TYPE, CI_SEQUENCE_NUMBER HAVING COUNT(*) > 1)

  - id: silver_pk_unique
    layer: silver
    description: "Silver primary keys unique"
    severity: fail
    sql: >-
      SELECT
        (SELECT COUNT(*) - COUNT(DISTINCT student_id) FROM silver_student)
      + (SELECT COUNT(*) - COUNT(DISTINCT unit_of_learning_id) FROM silver_unit_of_learning)
      + (SELECT COUNT(*) - COUNT(DISTINCT organisation_id) FROM silver_organisation)
      + (SELECT COUNT(*) - COUNT(DISTINCT location_id) FROM silver_location)
      + (SELECT COUNT(*) - COUNT(DISTINCT learning_period_id) FROM silver_learning_period)
      + (SELECT COUNT(*) - COUNT(DISTINCT load_id) FROM silver_student_unit_load)

  # ---------- referential integrity
  - id: fk_student
    layer: silver
    severity: fail
    description: "Every load row has a student"
    sql: "SELECT COUNT(*) FROM silver_student_unit_load f LEFT ANTI JOIN silver_student s ON f.student_id = s.student_id"
  - id: fk_unit
    layer: silver
    severity: fail
    description: "Every load row has a unit version (UNIT_CD + UV_VERSION_NUMBER)"
    sql: "SELECT COUNT(*) FROM silver_student_unit_load f LEFT ANTI JOIN silver_unit_of_learning u ON f.unit_of_learning_id = u.unit_of_learning_id"
  - id: fk_location
    layer: silver
    severity: fail
    description: "Every load row has a campus (via STUDENT_UNIT_ATTEMPT.LOCATION_CD)"
    sql: "SELECT COUNT(*) FROM silver_student_unit_load f LEFT ANTI JOIN silver_location l ON f.location_id = l.location_id"
  - id: fk_teaching_org_unit
    layer: silver
    severity: fail
    description: "Every load row has a teaching org unit (TR_ORG_UNIT_CD + TR_OU_START_DT)"
    sql: "SELECT COUNT(*) FROM silver_student_unit_load f LEFT ANTI JOIN silver_organisation o ON f.teaching_organisation_id = o.organisation_id"
  - id: fk_learning_period
    layer: silver
    severity: fail
    description: "Every load row has a learning period (CAL_INSTANCE)"
    sql: "SELECT COUNT(*) FROM silver_student_unit_load f LEFT ANTI JOIN silver_learning_period p ON f.learning_period_id = p.learning_period_id"

  # ---------- value ranges / domains
  - id: eftsu_range
    layer: silver
    severity: fail
    description: "EFTSU per load row between 0 and 1"
    sql: "SELECT COUNT(*) FROM silver_student_unit_load WHERE eftsu < 0 OR eftsu > 1"
  - id: completion_status_domain
    layer: silver
    severity: fail
    description: "UNIT_COMPLETION_STATUS is a TCSI E355 code (1-5)"
    sql: "SELECT COUNT(*) FROM silver_student_unit_load WHERE completion_status NOT IN (1, 2, 3, 4, 5) OR completion_status IS NULL"
  - id: reporting_period_format
    layer: silver
    severity: fail
    description: "Reporting period is YYYY-1 or YYYY-2"
    sql: "SELECT COUNT(*) FROM silver_student_unit_load WHERE NOT rlike(reporting_period, '{reporting_period.pattern}')"
  - id: closed_campus_with_load
    layer: silver
    severity: warn
    description: "Load recorded against a campus flagged closed"
    sql: "SELECT COUNT(*) FROM silver_student_unit_load f JOIN silver_location l ON f.location_id = l.location_id WHERE l.is_closed"

  # ---------- reconciliation (row counts and totals)
  - id: fact_no_fanout
    layer: silver
    severity: fail
    description: "Silver fact rows = GOVT_STUDENT_LOAD rows after submission selection (joins did not duplicate rows)"
    sql: "SELECT abs((SELECT COUNT(*) FROM silver_student_unit_load) - (SELECT COUNT(*) FROM bronze_gsl_selected))"
  - id: students_have_load
    layer: silver
    severity: fail
    description: "Every Silver student has at least one load row (PERSON filtered to students)"
    sql: "SELECT COUNT(*) FROM silver_student s LEFT ANTI JOIN silver_student_unit_load f ON s.student_id = f.student_id"
  - id: gold_eftsl_reconciles
    layer: gold
    severity: fail
    description: "Total EFTSL is identical in Silver (filtered) and in every Gold report"
    sql: >-
      SELECT COUNT(*) FROM (
        SELECT reporting_period, SUM(eftsl) AS v FROM gold_student_load_by_unit GROUP BY reporting_period
        UNION ALL SELECT reporting_period, SUM(eftsl) FROM gold_student_load_by_campus GROUP BY reporting_period
        UNION ALL SELECT reporting_period, SUM(eftsl) FROM gold_student_load_by_teaching_org_unit GROUP BY reporting_period
        UNION ALL SELECT reporting_period, SUM(eftsl) FROM gold_student_load_by_unit_campus GROUP BY reporting_period
      ) g JOIN (
        SELECT reporting_period, SUM(eftsu) AS v FROM silver_student_unit_load
        WHERE completion_status IN ({government_load.include_completion_status}) GROUP BY reporting_period
      ) s ON g.reporting_period = s.reporting_period
      WHERE abs(g.v - s.v) > 0.000001
  - id: gold_headcount_reconciles
    layer: gold
    severity: fail
    description: "Period headcount in Gold equals distinct students in Silver"
    sql: >-
      SELECT COUNT(*) FROM gold_reporting_period g JOIN (
        SELECT reporting_period, COUNT(DISTINCT student_id) AS h FROM silver_student_unit_load
        WHERE completion_status IN ({government_load.include_completion_status}) GROUP BY reporting_period
      ) s ON g.reporting_period = s.reporting_period WHERE g.headcount <> s.h
