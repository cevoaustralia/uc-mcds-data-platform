# Gold layer: SOW D5 "standardised student load and cross-mapping to units and facilities"
#
# Executed by etl/common/pipeline.py as Spark SQL over the Silver tables (aliases below).
# The same SQL runs in Athena (Trino); only ANSI functions plus max_by() are used.
# Change a filter, dimension or measure here and re-run the Gold job; no code change.
#
# Measures
#   headcount  = number of distinct students (SOW: "how many students in each unit")
#   eftsl      = sum of Callista EFTSU (equivalent full-time student load)
# Headcount is NOT additive: a student in two units/campuses is counted once in each, so
# summing headcount across rows over-counts. EFTSL is additive and reconciles across reports.
#
# Each report is also published as an MCDS Reporting Framework Report Definition + Fact Data
# (reporting/schemas in the MCDS v2.1.1 package), one Fact Data file per reporting period.

version: 2

silver_tables:              # alias -> Silver table
  f: student_unit_load
  u: unit_of_learning
  l: location
  o: organisation
  p: learning_period

# Rows counted as load (resolved from business-rules government_load.include_completion_status)
common_filter: "f.completion_status IN ({government_load.include_completion_status})"

reports:

  student_load_by_unit:
    description: "Student headcount and EFTSL per unit per reporting period (D5 report 1)"
    joins:
      - "LEFT JOIN u ON f.unit_of_learning_id = u.unit_of_learning_id"
    dimensions:
      reporting_period: "f.reporting_period"
      unit_code: "f.unit_code"
    attributes:                       # descriptive columns, not grouping keys
      unit_name: "max_by(u.unit_name, u.unit_version)"
    measures:
      headcount: "COUNT(DISTINCT f.student_id)"
      eftsl: "CAST(SUM(f.eftsu) AS DECIMAL(18,6))"
      unit_enrolments: "COUNT(DISTINCT f.unit_enrolment_id)"
    derived:                          # Gold convenience only; not sent as MCDS facts
      eftsl_per_student: "CAST(eftsl / headcount AS DECIMAL(18,6))"
    mcds_report:
      reportDefinitionId: "AU.UC.StudentLoadByUnit"
      label: "Student load by unit of learning"
      dimensions:
        dim.unit: {member: unit_code, label: unit_name, type: "Unit Of Learning"}

  student_load_by_campus:
    description: "Student headcount and EFTSL per campus (facility = MCDS location) per reporting period (D5 report 2, headline facility view)"
    joins:
      - "LEFT JOIN l ON f.location_id = l.location_id"
    dimensions:
      reporting_period: "f.reporting_period"
      location_id: "f.location_id"
    attributes:
      location_name: "max(l.location_name)"
    measures:
      headcount: "COUNT(DISTINCT f.student_id)"
      eftsl: "CAST(SUM(f.eftsu) AS DECIMAL(18,6))"
      unit_count: "COUNT(DISTINCT f.unit_code)"
    derived:
      eftsl_per_student: "CAST(eftsl / headcount AS DECIMAL(18,6))"
    mcds_report:
      reportDefinitionId: "AU.UC.StudentLoadByCampus"
      label: "Student load by campus"
      dimensions:
        dim.campus: {member: location_id, label: location_name, type: "Campus"}

  student_load_by_teaching_org_unit:
    description: "Student headcount and EFTSL per teaching-responsibility org unit (facility = faculty/school, MCDS organisation) per reporting period"
    joins:
      - "LEFT JOIN o ON f.teaching_organisation_id = o.organisation_id"
    dimensions:
      reporting_period: "f.reporting_period"
      org_unit_code: "f.teaching_org_unit_code"
    attributes:
      org_unit_name: "max_by(o.organisation_name, o.start_date)"
    measures:
      headcount: "COUNT(DISTINCT f.student_id)"
      eftsl: "CAST(SUM(f.eftsu) AS DECIMAL(18,6))"
      unit_count: "COUNT(DISTINCT f.unit_code)"
    derived:
      eftsl_per_student: "CAST(eftsl / headcount AS DECIMAL(18,6))"
    mcds_report:
      reportDefinitionId: "AU.UC.StudentLoadByTeachingOrgUnit"
      label: "Student load by teaching organisational unit"
      dimensions:
        dim.orgUnit: {member: org_unit_code, label: org_unit_name, type: "Organisational Unit"}

  student_load_by_unit_campus:
    description: "Cross-mapping: student headcount and EFTSL per unit x campus per reporting period"
    joins:
      - "LEFT JOIN u ON f.unit_of_learning_id = u.unit_of_learning_id"
      - "LEFT JOIN l ON f.location_id = l.location_id"
    dimensions:
      reporting_period: "f.reporting_period"
      unit_code: "f.unit_code"
      location_id: "f.location_id"
    attributes:
      unit_name: "max_by(u.unit_name, u.unit_version)"
      location_name: "max(l.location_name)"
    measures:
      headcount: "COUNT(DISTINCT f.student_id)"
      eftsl: "CAST(SUM(f.eftsu) AS DECIMAL(18,6))"
    derived: {}
    mcds_report:
      reportDefinitionId: "AU.UC.StudentLoadByUnitAndCampus"
      label: "Student load by unit of learning and campus"
      dimensions:
        dim.unit: {member: unit_code, label: unit_name, type: "Unit Of Learning"}
        dim.campus: {member: location_id, label: location_name, type: "Campus"}

  # Reporting-period calendar used by every Fact Data file (reportingPeriod start/end dates)
  reporting_period:
    description: "Reporting periods with first/last teaching dates (from CAL_INSTANCE via Silver learning_period)"
    joins:
      - "LEFT JOIN p ON f.learning_period_id = p.learning_period_id"
    dimensions:
      reporting_period: "f.reporting_period"
    attributes:
      start_date: "min(p.start_date)"
      end_date: "max(p.end_date)"
    measures:
      headcount: "COUNT(DISTINCT f.student_id)"
      eftsl: "CAST(SUM(f.eftsu) AS DECIMAL(18,6))"
    derived: {}

mcds_reporting:
  region: AU
  definition_version: "2026.1"
  metric_dimension:
    dimensionID: dim.metric
    members:
      HEADCOUNT: {measure: headcount, label: "Headcount (distinct students)", measureType: students, unit: students, decimals: 0}
      EFTSL: {measure: eftsl, label: "Equivalent full-time student load (EFTSL)", measureType: load, unit: EFTSL, decimals: 4}
  responsibilities:
    - {name: "Cevo Data Engineering (EBA)", role: "Data producer"}
